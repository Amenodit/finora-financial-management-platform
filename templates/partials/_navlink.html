<a href="{{ url }}"
   class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition
          {% if request.path == url %}bg-brand-50 text-brand-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
    <span class="w-2 h-2 rounded-full {% if request.path == url %}bg-brand-600{% else %}bg-slate-300{% endif %}"></span>
    {{ label }}
</a>
